# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  Egern 去广告模块 · 应用合集                                                 ║
# ║  百度贴吧 / 起点读书 / 抖音 / 闲鱼 / 美团 / 腾讯视频 / 小红书                     ║
# ║  哔哩哔哩 / 高德地图 / 盒马 / 京东 / 中国移动 / 虎牙直播 / 斗鱼直播                  ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# ▎Surge 版本
#   Surge_AdBlock_Module.sgmodule（14 款合集）与 Surge_Modules/*.sgmodule（分应用，可单独开关）由本文件逐条转换生成，
#   规则 / 重写 / jq / 脚本与本文件保持一致。改动请以本文件为准，然后在仓库根目录执行
#     pip install -r tools/requirements.txt   （首次）
#     python tools/gen_surge.py --check       （重新生成 Surge 文件并校验；新增应用需先在脚本的 APPS / FILE / KEYS 登记）
#
# ▎使用方法
#   1. 把本文件放到可访问的地址（GitHub raw / 自己的服务器 / Egern 本地文件）
#   2. Egern → 工具 → 模块 → 添加 → 填入文件地址
#   3. 设置 → MITM → 生成 CA 证书 → 安装并在「设置-通用-关于本机-证书信任设置」里开启信任
#   4. 部分 App 需要清缓存或重装后才会生效
#
# ▎单独开关（核心需求）
#   每个应用都有一个 *_disabled 参数：false = 开启过滤（默认），true = 关闭过滤
#   方式 A：Egern → 模块详情页 → 参数，直接修改
#   方式 B：在主配置 modules 里覆盖，例如：
#     modules:
#       - name: 应用去广告合集
#         url: https://your.host/Egern_AdBlock_Module.yaml
#         compat_arguments:
#           douyin_disabled: true          # 关闭抖音过滤
#           tieba_filter_video_thread: 1   # 贴吧推荐页同时过滤视频帖
#
# ▎注意
#   - 关闭某个应用的开关后，它的 规则/重写/脚本 全部停用，但 MITM 域名仍在列表中（无副作用，仅多一次解密）
#     若某 App 出现无法加载、证书报错，请直接把它的域名从底部 mitm.hostnames 中删掉
#   - 抖音默认【不做 MITM】：解密 api*.amemv.com / aweme*.snssdk.com 会让播放器的 /aweme/v1/play/ 等请求
#     证书校验失败（播放器用的是自带 TLS 栈，不信任用户安装的 CA），表现为"播放视频时接口报错"。
#     开屏 / 穿山甲 / DSP / 统计广告全部改为域名层拦截（ads*-normal-*.zijieapi.com、p*-ad-sign.byteimg.com 等），
#     不解密也能生效且不影响播放；信息流内嵌广告由服务端混排且带签名校验，无 MITM 时无法去除（社区共识），
#     想尝试的用户可通过 douyin_mitm_* 参数手动开启 MITM（见参数说明）
#   - 腾讯视频规则（RuCu6）上游已停更，高版本客户端可能失效
#   - 美团 / 美团外卖客户端有证书锁定，接口层无法 MITM；本模块只处理开屏素材 CDN、运营配置与广告/统计域名
#   - 哔哩哔哩的推荐 / 动态 / 播放页广告走 gRPC（HTTP/2），依赖 kokoryh 的 ProtoBuf 脚本与 Egern 的 h2 MITM；
#     为迫使客户端走可解密域名，模块会拦截 api/app.biliapi.com|net 备用域、HTTPDNS 以及 dns.google（防 DoH 绕过）
#   - 中国移动 App 的开屏 / 营销接口因省份不同而异，模块覆盖了全国版 + 广东 / 山东 / 江苏三省，其它省份如仍有开屏请反馈接口
#   - 虎牙主接口为 WUP 二进制协议，只能拦开屏素材 / 广告投放 / 统计域名（fmz200 亦标注无法完全去广告）；斗鱼的脚本逻辑已全部改写为 jq
#   - 闲鱼 / 起点 / 贴吧 的 JSON 接口全部用 Egern 原生 jq 处理，不依赖第三方脚本；
#     只有 贴吧 ProtoBuf（app2smile）和 小红书 信息流/水印（fmz200）两处使用 GitHub 上的脚本，
#     且已固定到审计过的 commit（见 scriptings 段说明）
#
# ▎规则来源与交叉验证（2026-11-07）
#   - 域名类 REJECT 规则逐条比对了 3 个独立维护的广告列表：blackmatrix7 Advertising(Reject.yaml) / 秋风 AWAvenue / AdGuard DNS filter，
#     并用 lingeringsound 10007 白名单反查误杀；只有 ≥2 个来源或语义明确（如 mads / impdsp）的域名才保留
#   - 开屏接口比对了 app2smile（贴吧原作者）、kelee、fmz200、blackmatrix7、NobyDa、ddgksf2013、deezertidal、ihxperfect、
#     zwf234、GFBG-IT、zqzess、syttys 等 12 份规则，取交集/并集后写入，单一来源且用途不明的已剔除
#   - 本模块所有 url_rewrites 的 location 只会是 http://reject*/ 内置空响应，不会跳转到任何第三方地址
#
# ▎参考项目（规则与脚本来源，感谢原作者）
#   - 可莉 iKeLee  https://github.com/luestr/ProxyResource  （经 https://github.com/QingRex/LoonKissSurge 转换）
#   - 奶思 fmz200  https://github.com/fmz200/wool_scripts
#   - app2smile    https://github.com/app2smile/rules        （贴吧 ProtoBuf 脚本）
#   - 墨鱼 ddgksf2013 https://github.com/ddgksf2013/Rewrite
#   - RuCu6        腾讯视频 / 小红书 原始规则
#   - Egern 官方模块文档 https://egernapp.com/zh-CN/docs/configuration/modules
#
# ▎语法速查（Egern 原生写法）
#   url_rewrites  location 特殊值：http://reject/ (404) · http://reject-200/ · http://reject-dict/ ({})
#                                  http://reject-array/ ([]) · http://reject-img/ (1x1 gif) · http://reject-video/
#   body_rewrites response_jq 使用 jq 表达式直接改 JSON，无需脚本
#   scriptings    http_response 兼容 Surge/Loon 脚本，$argument 通过 arguments._compat.$argument 传入
# ──────────────────────────────────────────────────────────────────────────────

name: "应用去广告合集"
description: "百度贴吧 / 起点读书 / 抖音 / 闲鱼 / 美团 / 腾讯视频 / 小红书 / 哔哩哔哩 / 高德地图 / 盒马 / 京东 / 中国移动 / 虎牙 / 斗鱼 去广告。可在参数中单独开关每个应用（*_disabled: true 为关闭）。需开启 MITM。"
author: "Thomas"
homepage: "https://egernapp.com/zh-CN/docs/configuration/modules"
icon: "shield.lefthalf.filled"

# ──────────────────────────────────────────────────────────────────────────────
# 参数（开关）
# ──────────────────────────────────────────────────────────────────────────────
compat_arguments:
  # ===== 各应用过滤开关：false = 开启过滤 / true = 关闭过滤 =====
  tieba_disabled: false            # 百度贴吧
  qidian_disabled: false           # 起点读书
  douyin_disabled: false           # 抖音（开屏 / 联盟广告 / 统计上报）
  xianyu_disabled: false           # 闲鱼
  meituan_disabled: false          # 美团 / 美团外卖
  tencent_video_disabled: false    # 腾讯视频
  xiaohongshu_disabled: false      # 小红书
  bilibili_disabled: false         # 哔哩哔哩（开屏 / 推荐流 / 动态 / 播放页 / 评论 / 搜索广告，含 P2P 屏蔽）
  amap_disabled: false             # 高德地图
  hema_disabled: false             # 盒马
  jd_disabled: false               # 京东
  chinamobile_disabled: false      # 中国移动（含广东 / 山东 / 江苏分省接口）
  huya_disabled: false             # 虎牙直播（开屏 / 广告素材 / 统计；信息流为 WUP 二进制协议无法处理）
  douyu_disabled: false            # 斗鱼直播（开屏 / 首页轮播与视频流广告 / 直播间悬浮窗 / P2P）
  # ===== 细项 =====
  tieba_filter_video_thread: 0        # 贴吧推荐页是否同时过滤视频帖：0 否 / 1 是
  # ----- 抖音 MITM（默认关闭）-----
  # 解密 api*.amemv.com / aweme*.snssdk.com 后，抖音播放器请求 /aweme/v1/play/ 等接口会因证书校验失败而报错、视频无法播放。
  # 因此抖音默认只做「域名层」拦截（开屏 / 穿山甲 / DSP / 统计），不解密任何抖音域名，播放不受影响。
  # 仍想尝试 MITM（部分旧版本客户端可用）：把下面三项改为 false / 对应域名即可。
  douyin_mitm_disabled: true                       # 抖音 MITM 相关规则总开关（QUIC 禁用 + URL 重写）
  douyin_mitm_host_1: "douyin-mitm-off.invalid"    # 开启 MITM 时改为 "api*.amemv.com"
  douyin_mitm_host_2: "douyin-mitm-off.invalid"    # 开启 MITM 时改为 "aweme*.snssdk.com"
  douyin_feed_filter_disabled: true                # 抖音信息流 jq 过滤（实验性，依赖上面的 MITM，默认关闭）

compat_arguments_desc: |
  ▸ *_disabled：每个应用的独立开关。false = 开启过滤（默认），true = 关闭该应用的全部规则/重写/脚本。
    tieba_disabled / qidian_disabled / douyin_disabled / xianyu_disabled / meituan_disabled /
    tencent_video_disabled / xiaohongshu_disabled / bilibili_disabled / amap_disabled /
    hema_disabled / jd_disabled / chinamobile_disabled / huya_disabled / douyu_disabled
  ▸ bilibili_disabled 同时控制 B 站 P2P（PCDN）端口与 dns.google 拦截：后者是为了阻止 B 站用 DoH 绕过本地 DNS，
    若你的 DNS 上游恰好只有 dns.google，请改用其他上游或关闭 B 站过滤。
  ▸ tieba_filter_video_thread：贴吧推荐页是否连视频帖一起过滤，0 否（默认）/ 1 是。
  ▸ douyin_mitm_disabled：抖音 MITM 相关规则（QUIC 禁用、/api/ad/ 等 URL 重写）。默认 true（关闭）。
    解密抖音 API 域名会导致视频播放接口报错，所以默认不解密；抖音广告仅靠域名拦截（开屏 / 穿山甲 / DSP / 统计）。
  ▸ douyin_mitm_host_1 / douyin_mitm_host_2：要解密的抖音域名，默认为占位符（不解密）。
    想试 MITM 时分别填 "api*.amemv.com" 与 "aweme*.snssdk.com"，并把 douyin_mitm_disabled 改为 false。
  ▸ douyin_feed_filter_disabled：抖音信息流广告 jq 过滤，实验性，依赖 MITM，默认 true（关闭）。

# ──────────────────────────────────────────────────────────────────────────────
# 分流规则（域名 / IP / 协议层拦截，不需要 MITM）
# ──────────────────────────────────────────────────────────────────────────────
rules:
  # ───────── 百度贴吧 ─────────
  # 开屏广告的 4 层拦截：
  #   ① 开屏接口 c/f/ad/getSplashAd（JSON）→ 下方 jq 把 error_code 改为 2230209（app2smile / kelee / ZenmoFeiShi 一致做法，
  #      不能直接 reject，否则影响启动流程）
  #   ② 全局配置 c/s/sync 里的 home_screen_ad / ad_config / ad_adsense 等字段 → 下方 jq 删除
  #   ③ 百度广告 SDK（百青藤 mobads / 网盟 cpro / afd / 统计）域名 → 本段 REJECT
  #      以下域名均同时出现在 ≥2 个独立列表（blackmatrix7 Reject / 秋风 AWAvenue / AdGuard DNS filter）
  #      注意：als.baidu.com 虽在广告列表中，但贴吧「签到」依赖它（多个白名单标注），故不拦截
  #   ④ 旧版接口 c/s/splashSchedule、forum/getAdInfo → 下方 url_rewrites 兼容性拦截
  - domain:
      name: "贴吧 · 百度联盟广告"
      match: afd.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百青藤移动广告"
      match: mobads.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百青藤广告日志"
      match: mobads-logs.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百青藤广告预配置"
      match: mobads-pre-config.cdn.bcebos.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度网盟广告"
      match: cpro.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度网盟广告静态资源"
      match: cpro.baidustatic.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度 DUP 广告静态资源"
      match: dup.baidustatic.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度广告位"
      match: pos.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度广告点击统计"
      match: nsclick.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度广告点击统计"
      match: eclick.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - domain:
      name: "贴吧 · 百度统计"
      match: hm.baidu.com
      policy: REJECT
      disabled: {{{tieba_disabled}}}
  - ip_cidr:
      name: "贴吧 · 屏蔽百度 HTTPDNS（保证 MITM 生效；app2smile / kelee / fmz200 / ddgksf2013 一致）"
      match: 180.76.76.200/32
      policy: REJECT
      no_resolve: true
      disabled: {{{tieba_disabled}}}

  # ───────── 抖音（字节跳动广告 / 统计域名，全部不需要 MITM）─────────
  # 以下域名均同时出现在 ≥2 个独立列表（blackmatrix7 Reject / 秋风 AWAvenue / AdGuard DNS filter / chxm1023）。
  # 刻意未拦截：mcs.snssdk.com、toblog.ctobsnssdk.com（白名单标注为登录/风控依赖）、dig.bdurl.net（仅单一来源，另有维护者标注 DIRECT）
  # 开屏广告：新版字节系 App 的开屏/广告接口（/api/ad/splash/ 等）走独立域名 ads*-normal-*.zijieapi.com，
  # 域名层直接拒绝即可去开屏，不必解密 api*.amemv.com（解密会导致播放接口报错）。
  - domain_regex:
      name: "抖音 · 开屏 / 广告接口域名（ads3/ads5-normal-hl/lf/lq.zijieapi.com）"
      match: '^ads\d*-normal(?:-[a-z0-9]+)?\.zijieapi\.com$'
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain_regex:
      name: "抖音 · 广告素材图片 CDN（p*-ad-sign.byteimg.com）"
      match: '^p\d+-ad-sign\.byteimg\.com$'
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain_regex:
      name: "抖音 · 日志上报（log.amemv.com / log0-misc-hl.amemv.com）"
      match: '^log\d*(?:-misc-[a-z]{2})?\.amemv\.com$'
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain:
      name: "抖音 · 广告接口"
      match: ad.zijieapi.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain:
      name: "抖音 · 应用日志上报"
      match: applog.zijieapi.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain:
      name: "抖音 · 头条广告平台"
      match: ad.toutiao.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain:
      name: "抖音 · 头条 DSP 广告"
      match: dsp.toutiao.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain:
      name: "抖音 · 穿山甲广告接口"
      match: pangolin.snssdk.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain_suffix:
      name: "抖音 · 穿山甲广告 SDK"
      match: pangolin-sdk-toutiao.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain_suffix:
      name: "抖音 · 穿山甲广告 SDK（备用域 b）"
      match: pangolin-sdk-toutiao-b.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain_suffix:
      name: "抖音 · 穿山甲广告 SDK（备用域 1）"
      match: pangolin-sdk-toutiao1.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - domain_suffix:
      name: "抖音 · 穿山甲广告静态资源"
      match: pglstatp-toutiao.com
      policy: REJECT
      disabled: {{{douyin_disabled}}}
  - and:
      name: "抖音 · 禁用 QUIC（仅在开启 MITM 时需要，强制回落到 HTTPS 让 URL 重写可命中）"
      match:
        - protocol:
            match: quic
        - or:
            match:
              - domain_suffix:
                  match: amemv.com
              - domain_suffix:
                  match: snssdk.com
              - domain_suffix:
                  match: douyin.com
              - domain_suffix:
                  match: zijieapi.com
      policy: REJECT
      disabled: {{{douyin_mitm_disabled}}}

  # ───────── 起点读书 ─────────
  - domain:
      name: "起点 · 用户行为统计（秋风列表）"
      match: uedas.qidian.com
      policy: REJECT
      disabled: {{{qidian_disabled}}}

  # ───────── 闲鱼 ─────────
  - domain_keyword:
      name: "闲鱼 · 阿里系广告统计"
      match: iyes.youku.com
      policy: REJECT
      disabled: {{{xianyu_disabled}}}
  - and:
      name: "闲鱼 · 屏蔽 AMDC 调度（防止绕过 MITM）"
      match:
        - url_regex:
            match: '^http:\/\/.+\/amdc\/mobileDispatch'
        - or:
            match:
              - user_agent:
                  match: "闲鱼*"
              - user_agent:
                  match: "%E9%97%B2%E9%B1%BC*"
      policy: REJECT
      disabled: {{{xianyu_disabled}}}

  # ───────── 美团 / 美团外卖 ─────────
  - domain_suffix:
      name: "美团 · 广告"
      match: mads.meituan.com
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain_suffix:
      name: "美团 · 外卖广告"
      match: ad.e.waimai.sankuai.com
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain_suffix:
      name: "美团 · 统计上报"
      match: report.meituan.com
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain_suffix:
      name: "美团 · 统计上报"
      match: dreport.meituan.net
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain_suffix:
      name: "美团 · 统计上报"
      match: analytics.meituan.net
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain_suffix:
      name: "美团 · 外卖日志"
      match: wmlog.meituan.com
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain:
      name: "美团 · 设备日志上报（秋风列表）"
      match: data-sdk-uuid-log.d.meituan.net
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  - domain:
      name: "美团 · DSP 广告曝光（AdGuard 列表）"
      match: impdsp.meituan.com
      policy: REJECT
      disabled: {{{meituan_disabled}}}
  # 已移除 fmz200 单一来源且用途不明的 meituan.xn / meituan.yoga / meituangov.cn，避免误伤

  # ───────── 腾讯视频 ─────────
  # 先放行播放必需的 l.qq.com 子域（DRM / 直播），再整体拦截 l.qq.com 广告域
  - domain:
