              else . end))
        else . end
      disabled: {{{douyu_disabled}}}
  - response_jq:
      # 直播间：悬浮窗 / 宝箱入口
      match: '^https:\/\/apiv2\.douyucdn\.cn\/japi\/entrance\/roomRes\/nc\/m\/list'
      filter: 'if (.data|type) == "object" then del(.data.pendant_a, .data.entrance_d) else . end'
      disabled: {{{douyu_disabled}}}
  - response_jq:
      # 全局开关：大神陪玩 / 关注更多主播 / 直播横幅 / 首页活动悬浮窗 / 带货 / QQ 游戏（根级与 data 级两种结构都处理）
      match: '^https:\/\/venus\.douyucdn\.cn\/venus\/config\/static\/update.+keyCodeSet=flow_config'
      filter: >-
        def off: reduce ("greatGodGameSitterSwitch","followMoreAnchorEntrance","sdklivebanner","homeActFloatSwitch","bringGoodsSwitch","qqGameSwitch") as $k (.; if has($k) then .[$k] = 0 else . end);
        (if type == "object" then off else . end)
        | (if (.data|type) == "object" then .data |= off else . end)
      disabled: {{{douyu_disabled}}}

# ──────────────────────────────────────────────────────────────────────────────
# 脚本（只有 jq 做不到的才用脚本：贴吧 ProtoBuf、小红书信息流/水印）
#
# 安全审计（2026-11-07）：两段脚本均已逐行检查
#   · 不含 $httpClient / fetch / eval / new Function 等外联或动态执行代码（小红书脚本里的网络封装仅存在于通用 Env 库，脚本正文从未调用）
#   · 只做响应体字段删改 + 本地 $persistentStore 缓存（用于去水印），不读取 Cookie、不上传数据、不插入任何内容
#   · script_url 固定到审计时的 commit，远端仓库后续被改动也不会自动生效；需要升级时先 diff 再换 commit
#     tieba-proto.js  commit c9d4d50 (2025-11-18)  sha256 6015d737870b6d89c38a0181479ed715e07d11b5a2c3746f96f95e25835e8610
#     xiaohongshu.js  commit 2dfe1fa (2026-06-05)  sha256 318d89bce1117edb26a93b383804e195649ec4674a04efa9e3ddb4ef7f34b498
#   · 2026-11-07 第二批（哔哩哔哩 / 高德 / 盒马 / 京东）同样逐段检查并固定 commit：
#     kokoryh bilibili.protobuf.response.js  commit d513a2e (2026-11-05)  sha256 bfcc0970105056b51a02eb643931c8d4a8d9656f25a5c3f0d6fe9cf6b4d15f8e
#       - 只在 gRPC 响应里删 cm / ads 字段；内置 fetch 封装从未被调用；
#       - 它的「空降助手」功能会把 B 站 chronos 包地址换成作者自己 GitHub 上的 zip，本模块通过 "sponsorBlock":"#" 明确关闭，不引入第三方代码包
#     zirawell amap.js      commit f40c127 (2025-12-04)  sha256 f972c090681ff70942280c80f11687be330bbfbe77f1837dcea99f44e4663677  （RuCu6 原作，纯字段删改）
#     zirawell freshippo.js commit 2ce3867 (2025-12-04)  sha256 edf71faccbca61b153bbce98f56b75e27313883cf520e5e315f6ba15ed52360d  （纯字段过滤）
#     fmz200 jingdong.js    commit cd32a8c (2025-06-30)  sha256 3e7cc975f8985a4d2dbdbdefc405d0e3e6c9c07bf3c5361da1ecae206b6c04a1  （纯字段删改）
#     弃用 ddgksf2013/amap.js：代码经 jsjiami 混淆无法完整审计，改用功能等价、可读的 zirawell 版本
#   · 想跟随上游自动更新，可把 URL 中的 commit 换回 master / main（放弃固定版本的保护）
# ──────────────────────────────────────────────────────────────────────────────
scriptings:
  # ───────── 百度贴吧：ProtoBuf 接口（推荐流 / 吧内列表 / 帖内广告 / 信息流广告位）─────────
  - http_response:
      name: "贴吧 · ProtoBuf 信息流与帖内广告"
      match: '^https?:\/\/(?:tiebac|tieba|c\.tieba)\.baidu\.com\/c\/(?:f\/(?:excellent\/personalized|frs\/(?:page|threadlist|generalTabList)|ad\/getFeedAd|pb\/page)|b\/ad\/adBid)\?cmd=\d+&format=protobuf'
      script_url: https://raw.githubusercontent.com/app2smile/rules/c9d4d50aa5d6f96b04fddd5f2386e79047314830/js/tieba-proto.js
      body_required: true
      binary_body: true
      max_size: 5242880
      timeout: 10
      arguments:
        _compat.$argument: "per_filter_video_thread={{{tieba_filter_video_thread}}}"
      disabled: {{{tieba_disabled}}}

  # ───────── 小红书：fmz200 脚本（信息流广告 / 开屏 / 水印）─────────
  - http_response:
      name: "小红书 · 开屏广告与界面配置"
      match: '^https?:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/system_service\/(?:config\?|splash_config)'
      script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/2dfe1fa129085015a9abed46b4474d34d4426269/Scripts/xiaohongshu/xiaohongshu.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{xiaohongshu_disabled}}}
  - http_response:
      name: "小红书 · 信息流广告（首页 / 关注 / 搜索 / 感兴趣的人）"
      match: '^https?:\/\/(?:edith|rec|so|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v6\/homefeed\?|v4\/followfeed\?|v2\/user\/followings\/followfeed|v10\/search\/notes\?|v5\/recommend\/user\/follow_recommend\?)'
      script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/2dfe1fa129085015a9abed46b4474d34d4426269/Scripts/xiaohongshu/xiaohongshu.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{xiaohongshu_disabled}}}
  - http_response:
      name: "小红书 · 详情页小部件"
      match: '^https?:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/note\/widgets'
      script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/2dfe1fa129085015a9abed46b4474d34d4426269/Scripts/xiaohongshu/xiaohongshu.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{xiaohongshu_disabled}}}
  - http_response:
      name: "小红书 · 去图片 / 视频 / 实况照片水印"
      match: '^https?:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v1\/note\/(?:imagefeed|live_photo\/save)|v2\/note\/feed|v3\/note\/videofeed|v4\/note\/videofeed|v10\/note\/video\/save)'
      script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/2dfe1fa129085015a9abed46b4474d34d4426269/Scripts/xiaohongshu/xiaohongshu.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{xiaohongshu_disabled}}}
  - http_response:
      name: "小红书 · 评论区去水印"
      match: '^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v5\/note\/comment\/list|v3\/note\/comment\/sub_comments|v1\/interaction\/comment\/video\/download)\?'
      script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/2dfe1fa129085015a9abed46b4474d34d4426269/Scripts/xiaohongshu/xiaohongshu.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{xiaohongshu_disabled}}}

  # ───────── 哔哩哔哩：gRPC / ProtoBuf 接口（kokoryh Sparkle）─────────
  # 覆盖：热门 / 动态 / 播放页（推荐相关、底部商业卡、进度条推广点）/ 播放地址 / 弹幕视图 / 评论置顶广告 / 搜索结果广告
  # 需要 Egern 的 HTTP/2 MITM（gRPC 走 h2）。参数：displayUpList 动态最常访问(auto/show/hide)，purifyComment 过滤置顶评论广告，
  # sponsorBlock 固定为 "#"（关闭空降助手，避免替换客户端 chronos 包），logLevel 4 = 仅错误
  - http_response:
      name: "哔哩哔哩 · gRPC 信息流 / 播放页 / 评论 / 搜索广告"
      match: '^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.(?:show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(?:unite)?\.v1\.View\/(?:View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$'
      script_url: https://raw.githubusercontent.com/kokoryh/Sparkle/d513a2eeab382c640ccd5d6ecd76e07c4828b1ed/dist/bilibili.protobuf.response.js
      body_required: true
      binary_body: true
      max_size: 20971520
      timeout: 15
      arguments:
        _compat.$argument: '{"displayUpList":"auto","purifyComment":1,"sponsorBlock":"#","logLevel":"4"}'
      disabled: {{{bilibili_disabled}}}

  # ───────── 高德地图：zirawell（RuCu6 原作）脚本 ─────────
  # 覆盖：开屏、首页底部卡片、路线规划 / 导航详情推广与插播语音广告、附近页、搜索建议 / 结果 / 详情页推广、我的页面、打车页、公交 / 酒店页
  - http_response:
      name: "高德 · 开屏 / 首页 / 路线规划 / 导航 / 搜索 / 附近 / 我的 / 打车页推广"
      match: '^https:\/\/(?:m5|m5-zb|info)\.amap\.com\/ws\/(?:aos\/perception\/publicTravel\/beforeNavi\?|boss\/car\/order\/content_info|boss\/order_web\/friendly_information|bus\/plan\/integrate\?|c3frontend\/af-(?:hotel|launch)\/page\/main|faas\/amap-navigation\/(?:card-service-plan-home|main-page(?:\?|$))|perception\/drive\/route(?:Info|Plan)|promotion-web\/resource(?:\/home)?\?|shield\/dsp\/profile\/index\/nodefaasv3\?|shield\/frogserver\/aocs\/updatable\/|shield\/search\/(?:common\/coupon\/info|nearbyrec_smart\?|poi\/detail)|shield\/search_bff\/hotword\?|shield\/search_poi\/(?:search\/sp|mps|sug|tips_operation_location)|valueadded\/alimama\/splash_screen\?)'
      script_url: https://raw.githubusercontent.com/zirawell/R-Store/f40c1273a36a19a35a537e3b2ea84fd5d1264764/Res/Scripts/AntiAd/amap.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{amap_disabled}}}

  # ───────── 盒马：zirawell 脚本 ─────────
  - http_response:
      name: "盒马 · 首页 / 我的页 / 信息流推广"
      match: '^https?:\/\/acs(?:\.|-)m\.(?:taobao|freshippo)\.com\/gw\/mtop\.wdk\.render\.query(?:indexpage|mypage|tabfeedstream)'
      script_url: https://raw.githubusercontent.com/zirawell/R-Store/2ce3867e8726edeaf87ceb0303ea07ef4fc2d376/Res/Scripts/AntiAd/freshippo.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{hema_disabled}}}

  # ───────── 京东：fmz200 脚本（开屏由上方 jq 处理）─────────
  - http_response:
      name: "京东 · 首页浮层 / 我的 / 订单 / 物流 / 新品页推广"
      match: '^https:\/\/api\.m\.jd\.com\/client\.action\?functionId=(?:deliverLayer|getTabHomeInfo|myOrderInfo|orderTrackBusiness|personinfoBusiness|welcomeHome)'
      script_url: https://raw.githubusercontent.com/fmz200/wool_scripts/cd32a8c7e5959712dca9839c37a0d0d4c3934a36/Scripts/jingdong/jingdong.js
      body_required: true
      max_size: 5242880
      timeout: 30
      disabled: {{{jd_disabled}}}

# ──────────────────────────────────────────────────────────────────────────────
# MITM 域名（HTTPS 解密范围；某 App 异常时可直接删掉对应行）
# ──────────────────────────────────────────────────────────────────────────────
mitm:
  hostnames:
    includes:
      # 百度贴吧
      - tiebac.baidu.com
      - tieba.baidu.com
      - c.tieba.baidu.com
      # 起点读书
      - magev6.if.qidian.com
      - mage.if.qidian.com
      - ywab.reader.qq.com
      - qidian.qpic.cn                 # 运营图片 CDN（仅为拦截 qidian_common 开屏图；介意解密开销可删）
      # 抖音：默认不解密（解密 API 域名会让播放器的 /aweme/v1/play/ 等请求证书校验失败、视频报错）。
      # 下面两项是参数占位符，默认指向不存在的 *.invalid 域名，等于不解密；
      # 想尝试 MITM 时在参数里把 douyin_mitm_host_1 / _2 改为 "api*.amemv.com" / "aweme*.snssdk.com"
      - "{{{douyin_mitm_host_1}}}"
      - "{{{douyin_mitm_host_2}}}"
      # 闲鱼
      - acs.m.goofish.com
      - g-acs.m.goofish.com
