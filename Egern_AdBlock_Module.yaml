# ──────────────────────────────────────────────────────────────────────────────
# 消息体重写（jq 直接修改 JSON / 请求体正则）
# ──────────────────────────────────────────────────────────────────────────────
body_rewrites:
  # ───────── 百度贴吧 ─────────
  - response_jq:
      # 全局配置：删除广告 / 弹窗 / 运营相关字段，并把广告数量压为 0
      match: '^https?:\/\/tieba(?:c)?\.baidu\.com\/c\/s\/sync$'
      filter: >-
        del(.activity_switch, .video_report_config, .advertisement_config, .next_start,
            .push_strategy_new, .live_activity_guide, .h5_pop_ups, .h5_pop_ups_config,
            .duxiaoman_url, .is_need_remind_live_rooms, .floating_icon, .ad_stlog_switch,
            .first_time_motivate, .windowStrategyList, .ad_adsense, .ad_config,
            .videoup_guide_pop, .ad_origin_config_switch, .needNewUserLead, .alaTabColor,
            .search_guide, .ad_sdk_priority, .low_version_pop_config, .ad_num_competition_frs,
            .live_new_user_guide_day, .screen_fill_data_result, .yy_live_tab,
            .ad_num_competition_personalize, .complete_apk_url, .user_activity, .homepage_guide,
            .bottom_bubble_config, .home_screen_ad, .afSearch_tab, .recent_client_info,
            .video_activity, .namoaixud_url, .yy_live_config, .user_growth_task_list,
            .cloud_control_data_info, .scheme_whitelist)
        | if (.wl_config|type) == "object" then
            .wl_config |= (
              del(.pb_banner_funad_cache_strategy, .pb_comment_asyncafd_cache_strategy,
                  .download_edge_float, .download_pause_retain_dialog_conf,
                  .download_mobile_dialog_conf, .download_fake_progress_config_a,
                  .download_fake_progress_config_b)
              | (if has("home_ad_num") then .home_ad_num = 0 else . end)
              | (if has("frs_ad_num") then .frs_ad_num = 0 else . end)
              | (if has("pb_comment_ad_num") then .pb_comment_ad_num = 0 else . end)
              | (if has("index_bear_density") then .index_bear_density = 0 else . end)
              | (if has("frs_bear_density") then .frs_bear_density = 0 else . end)
              | (if has("index_bear_first_floor_max") then .index_bear_first_floor_max = 999999999 else . end)
              | (if has("index_bear_first_floor_min") then .index_bear_first_floor_min = 999999999 else . end))
          else . end
      disabled: {{{tieba_disabled}}}
  - response_jq:
      # 精简首页顶部 Tab（只保留「推荐」，非广告，不需要可删）
      match: '^https?:\/\/tieba(?:c)?\.baidu\.com\/c\/s\/sync$'
      filter: >-
        if (.index_tab_info|type) == "array" then .index_tab_info |= map(select(.tab_name == "推荐")) else . end
