# ──────────────────────────────────────────────────────────────────────────────
# URL 重写（直接返回空响应，相当于 Surge 的 Map Local / reject-*）
# ──────────────────────────────────────────────────────────────────────────────
url_rewrites:
  # ───────── 百度贴吧 ─────────
  - match: '^https?:\/\/tieba(?:c)?\.baidu\.com\/c\/f\/forum\/getInterestClassList$'   # 兴趣分类推荐
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  - match: '^https?:\/\/tieba(?:c)?\.baidu\.com\/c\/f\/search\/discover$'                # 搜索发现
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  - match: '^https:\/\/tieba\.baidu\.com\/c\/f\/forum\/getForumAlbum$'                   # 吧内相册运营位
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  - match: '^https?:\/\/c\.tieba\.baidu\.com\/c\/f\/forum\/hotforum$'                    # 热门吧推荐
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  # 旧版开屏 / 广告接口（blackmatrix7、NobyDa、GFBG-IT、zqzess、ihxperfect 等 ≥6 个列表一致；新版客户端走 getSplashAd，由 jq 处理）
  - match: '^https?:\/\/(?:c\.tieba|tiebac)\.baidu\.com\/c\/s\/splashSchedule'             # 旧版开屏排期
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  - match: '^https?:\/\/(?:c\.tieba|tiebac)\.baidu\.com\/c\/f\/forum\/getAdInfo'          # 旧版吧内广告
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  - match: '^https?:\/\/(?:c\.tieba|tiebac)\.baidu\.com\/c\/s\/logtogether\?cmd='         # 埋点上报（NobyDa / Keywos / syttys）
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}
  - match: '^https?:\/\/(?:c\.tieba|tiebac)\.baidu\.com\/c\/s\/(?:mlog|newlog)$'          # 行为日志上报
    location: http://reject-dict/
    disabled: {{{tieba_disabled}}}

  # ───────── 起点读书 ─────────
  - match: '^https?:\/\/mage(?:v6)?\.if\.qidian\.com\/argus\/api\/v\d\/client\/getsplashscreen'   # 开屏广告
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https?:\/\/magev6\.if\.qidian\.com\/argus\/api\/v\d\/adv\/'                 # 各类广告位（含 getadvlistbatch）
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https?:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/client\/iosad'          # iOS 广告配置
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https?:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/bookshelf\/getad'       # 书架广告
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https?:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/bookshelf\/getHoverAdv'  # 书架右下角悬浮广告（app2smile）
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https?:\/\/mage\.if\.qidian\.com\/Atom\.axd\/Api\/Client\/GetConfIOS'       # 旧版广告配置（NobyDa / syttys / fmz200）
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https?:\/\/qidian\.qpic\.cn\/qidian_common\/'                               # 开屏 / 运营图片（NobyDa / syttys / bai1zi / fmz200；若运营图标缺失可删）
    location: http://reject-img/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/ywab\.reader\.qq\.com\/user\/experiments\/v2\?'                   # AB 实验（广告策略）
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/push\/getdialog\?'       # 弹窗
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/message\/getpushedmessagelist$'   # 推送消息列表
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/maintain\/playstrip$'    # 横幅条
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/dailyrecommend\/recommendBook\?'   # 每日推书
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/freshman\/bookshelfbtn$' # 新人书架按钮
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/bookshelf\/getTopOperation$'   # 书架顶部运营位
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/booksearch\/hotWords\?'  # 搜索框填充词
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/followsubscribe\/showChapterEndModule\?'   # 章末推广模块
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/checkin\/simpleinfo\?'   # 签到提醒（精简）
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}
  - match: '^https:\/\/magev6\.if\.qidian\.com\/argus\/api\/v1\/young\/getconf$'         # 青少年模式弹窗
    location: http://reject-dict/
    disabled: {{{qidian_disabled}}}

  # ───────── 抖音（以下全部依赖 MITM，默认随 douyin_mitm_disabled 关闭；域名层拦截见 rules 段）─────────
  - match: '^https?:\/\/[\w-]+\.(?:amemv|snssdk|douyin)\.com\/api\/ad\/'                 # 开屏 / 联盟广告接口
    location: http://reject-dict/
    disabled: {{{douyin_mitm_disabled}}}
  - match: '^https?:\/\/[\w-]+\.(?:amemv|snssdk|douyin)\.com\/aweme\/v\d\/(?:ad|splash|screen\/ad)\/'   # 广告 / 开屏（screen/ad 来自 NobyDa / syttys）
    location: http://reject-dict/
    disabled: {{{douyin_mitm_disabled}}}
  - match: '^https?:\/\/[\w-]+\.snssdk\.com\/.+_ad\/'                                    # 其他 *_ad 接口
    location: http://reject-dict/
    disabled: {{{douyin_mitm_disabled}}}
